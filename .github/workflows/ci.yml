name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: macOS ARM64
            os: macos-14

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.76.2
          cache: true
      - name: Verify locked workspace
        run: pixi run --locked check

  downstream:
    name: Downstream ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.76.2
          cache: true
      - name: Verify pinned consumer contracts
        run: pixi run --locked check-downstream
      - name: Preserve reproducible proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: downstream-proof-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .pixi/downstream-proof/report.json
            .pixi/downstream-proof/*/sen.svg
            .pixi/downstream-proof/*/*.log

  package:
    name: Package Linux x86-64
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.76.2
          cache: true
      - name: Verify package version
        run: |
          pixi_version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pixi.toml)
          recipe_version=$(sed -n 's/^  version: "\([^"]*\)"$/\1/p' conda.recipe/recipe.yaml)
          if [[ -z "$pixi_version" || -z "$recipe_version" || "$pixi_version" != "$recipe_version" ]]; then
            echo "pixi.toml version '$pixi_version' does not match recipe version '$recipe_version'" >&2
            exit 1
          fi
      - name: Build package
        run: pixi run --locked package
