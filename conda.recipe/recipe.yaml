context:
  version: "0.0.0"

package:
  name: mojo-akari
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  script:
    - mojo precompile src/akari -o ${{ PREFIX }}/lib/mojo/akari.mojoc

requirements:
  build:
    - mojo-compiler =1.0.0
  host:
    - mojo-compiler =1.0.0
  run:
    - ${{ pin_compatible('mojo-compiler') }}

tests:
  - script:
      - mojo run test_package.mojo
    files:
      recipe:
        - test_package.mojo

about:
  homepage: https://github.com/Ameyanagi/akari
  repository: https://github.com/Ameyanagi/akari
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
  summary: Color science, palettes, and scientific colormaps for Mojo.

extra:
  maintainers:
    - Ameyanagi
